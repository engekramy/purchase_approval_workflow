<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">

  <!-- Purple background with rounded corners -->
  <rect width="50" height="50" rx="8" fill="#875A7B"/>

  <!-- Document body — white rounded rectangle -->
  <rect x="8" y="6" width="24" height="30" rx="3" fill="#FFFFFF"/>

  <!-- Folded corner (dog-ear) top-right -->
  <polygon points="26,6 32,6 32,12" fill="#D9B8D0"/>
  <polygon points="26,6 26,12 32,12" fill="#F5EFF5"/>

  <!-- Document lines representing PO content -->
  <rect x="12" y="14" width="14" height="2" rx="1" fill="#C4A0BC"/>
  <rect x="12" y="19" width="14" height="2" rx="1" fill="#C4A0BC"/>
  <rect x="12" y="24" width="9"  height="2" rx="1" fill="#C4A0BC"/>

  <!-- Green approval badge circle -->
  <circle cx="36" cy="36" r="11" fill="#FFFFFF"/>
  <circle cx="36" cy="36" r="9"  fill="#28A745"/>

  <!-- White checkmark inside badge -->
  <polyline
    points="30,36 34,40 42,30"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"/>

</svg>
